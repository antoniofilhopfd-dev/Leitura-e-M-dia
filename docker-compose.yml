# Ambiente de desenvolvimento local (Etapa 2). O compose de produção com
# frontend + nginx é montado na Etapa 12 (ver docs/ESPECIFICACAO.md).

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: leitura_media
      POSTGRES_PASSWORD: leitura_media
      POSTGRES_DB: leitura_media
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leitura_media"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3333
      DATABASE_URL: "postgresql://leitura_media:leitura_media@postgres:5432/leitura_media?schema=public"
    ports:
      - "3333:3333"

volumes:
  postgres_data:
